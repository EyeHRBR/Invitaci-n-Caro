<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gracias por venir</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#9E1458">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=DM+Sans:wght@400&display=swap" rel="stylesheet">

  <style>
    :root {
      --fucsia: #9E1458;
      --mostaza: #F7B733;
      --crema: #FFF4EA;
    }

    html, body { margin: 0; height: 100%; }

    body {
      display: grid;
      place-items: center;
      background: var(--fucsia);
      color: var(--crema);
      font-family: "DM Sans", system-ui, sans-serif;
      text-align: center;
      padding: 24px 20px;
      box-sizing: border-box;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 800;
      font-size: clamp(2.4rem, 11vw, 3.2rem);
      line-height: 1.05;
      color: var(--mostaza);
      margin: 0 0 16px;
    }

    p { margin: 0; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1>¡Hicimos ruido!</h1>
    <p>La fiesta ya pasó. Gracias por celebrar conmigo.</p>
  </main>
</body>
</html>
